:root{--purple:#7c3aed;--bg:#f7f7fa;--white:#fff;--text:#171723;--muted:#6e6e7d;--border:#e8e8ee;--radius:20px;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;}
a{color:var(--purple);}
.wrap{width:92%;max-width:640px;margin:0 auto;}
.header{padding:20px 0 8px;}
.logo{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800;}
.logo-mark{width:40px;height:40px;border-radius:12px;background:linear-gradient(180deg,#8b5cf6,var(--purple));color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;box-shadow:0 4px 10px rgba(124,58,237,.3);}
.logo span{color:var(--purple);}
.page-card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:36px 28px;margin:40px 0;text-align:center;box-shadow:0 10px 24px rgba(23,23,35,.05);}
.code{font-size:56px;font-weight:800;color:var(--purple);margin-bottom:6px;}
.page-card h1{font-size:22px;margin-bottom:10px;}
.page-card p{color:var(--muted);font-size:15px;margin-bottom:22px;}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.btn{display:inline-block;padding:12px 20px;border-radius:12px;font-weight:800;text-decoration:none;}
.btn-primary{background:linear-gradient(180deg,#8b5cf6,var(--purple));color:#fff;box-shadow:0 6px 14px rgba(124,58,237,.3);}
.btn-secondary{background:var(--bg);color:var(--text);border:1px solid var(--border);}
.footer{margin-top:20px;padding:24px 0 40px;text-align:center;color:var(--muted);font-size:12px;line-height:2;}
.footer a{color:var(--purple);text-decoration:underline;}
</style>
